name: Microservice CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run Unit & Integration Tests with Coverage (JaCoCo)
        run: ./mvnw clean verify -B

      - name: Archive JaCoCo Code Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-reports
          path: |
            **/target/site/jacoco/
            **/target/jacoco.exec
          retention-days: 7

  build-docker-images:
    name: Build Docker Images (Multi-Stage Validation)
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build User Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./user-service/Dockerfile
          push: false
          tags: microservice-user-service:ci

      - name: Build Notification Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./notification-service/Dockerfile
          push: false
          tags: microservice-notification-service:ci

      - name: Build Chat Service Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./chat-service/Dockerfile
          push: false
          tags: microservice-chat-service:ci
