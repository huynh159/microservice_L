# ==============================================================================
# CẤU HÌNH USER-SERVICE TRONG MÔI TRƯỜNG DOCKER CONTAINER (PROFILE: DOCKER)
# ==============================================================================
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${USER_DB_NAME:user_db}
    username: ${USER_DB_USER:user_service_db_user}
    password: ${USER_DB_PASSWORD:user_service_db_pass}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_password_dev}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] [%X{traceId:-}] %-40.40logger{39} : %m%n"
  level:
    com.example.userservice: INFO
    org.springframework.security: WARN
