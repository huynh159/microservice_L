server:
  port: 8081

spring:
  application:
    name: user-service
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${USER_DB_NAME:user_db}
    username: ${USER_DB_USER:user_service_db_user}
    password: ${USER_DB_PASSWORD:user_service_db_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cache:
    type: redis
    redis:
      time-to-live: 600000 # 10 phut (10 * 60 * 1000)
      cache-null-values: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_password_dev}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

kafka:
  topics:
    user-events: ${KAFKA_TOPIC_USER_EVENTS:user-events}

outbox:
  polling:
    enabled: ${OUTBOX_POLLING_ENABLED:true}
    interval-ms: ${OUTBOX_POLLING_INTERVAL_MS:2000}
    batch-size: ${OUTBOX_POLLING_BATCH_SIZE:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:super_secret_jwt_key_that_is_at_least_256_bits_long_for_security_reasons}
  expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 phut (15 * 60 * 1000)
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 ngay (7 * 24 * 60 * 60 * 1000)

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%15.15t] [%X{traceId:-}] %-40.40logger{39} : %m%n"

