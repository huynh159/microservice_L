# GitLab CI/CD Pipeline cho Microservice Platform
image: eclipse-temurin:21-jdk-jammy

stages:
  - test
  - package

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .m2/repository

# Stage 1: Build & Test (Chạy kiểm thử với Testcontainers & JaCoCo coverage)
test:
  stage: test
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - chmod +x mvnw
  script:
    - ./mvnw clean verify -B
  artifacts:
    when: always
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"
    paths:
      - "**/target/site/jacoco/"
    expire_in: 7 days

# Stage 2: Kiểm thử tính toàn vẹn của Docker Multi-stage build
build-docker-images:
  stage: package
  image: docker:24
  services:
    - docker:24-dind
  only:
    - main
    - master
    - develop
    - merge_requests
  before_script:
    - echo "Validating Docker multi-stage image builds..."
  script:
    - docker build -t microservice-user-service:test -f user-service/Dockerfile .
    - docker build -t microservice-notification-service:test -f notification-service/Dockerfile .
    - docker build -t microservice-chat-service:test -f chat-service/Dockerfile .
