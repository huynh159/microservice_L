server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: user-service-auth
          uri: ${USER_SERVICE_URL:http://user-service:8081}
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service-users
          uri: ${USER_SERVICE_URL:http://user-service:8081}
          predicates:
            - Path=/api/v1/users/**

        - id: chat-service-rest
          uri: ${CHAT_SERVICE_URL:http://chat-service:8083}
          predicates:
            - Path=/api/v1/chat/**

        - id: chat-service-websocket
          uri: ${CHAT_WS_URL:ws://chat-service:8083}
          predicates:
            - Path=/ws/**,/ws-chat/**
